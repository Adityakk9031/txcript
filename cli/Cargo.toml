[package]
name = "txcript-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
description = "CLI for listing, searching, and continuing txcript sessions."
license = "Apache-2.0"
repository = "https://github.com/skillsynchq/txcript"
# Not published: crates.io ships only the txcript library. Install the CLI
# from git (`cargo install --git … txcript-cli`) or a local checkout.
publish = false

# The binary keeps the crate-family name.
[[bin]]
name = "txcript"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
clap_complete = "4.6.7"
txcript = { version = "0.3.0", path = "..", features = ["opencode", "search"] }

[lints]
workspace = true
